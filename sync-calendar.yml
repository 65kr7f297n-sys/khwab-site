name: Sync Airbnb calendar

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at :17
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Airbnb calendar and save dates
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: |
          python3 - <<'PY'
          import os, json, re, datetime, urllib.request

          url = os.environ.get("AIRBNB_ICAL_URL")
          if not url:
              raise SystemExit("The AIRBNB_ICAL_URL secret is not set in the repo.")

          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 khwab-calendar-sync"})
          text = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          text = re.sub(r"\r?\n[ \t]", "", text)  # unfold wrapped lines

          def iso(d):
              return f"{d[:4]}-{d[4:6]}-{d[6:8]}"

          found, blocked = set(), set()
          for block in text.split("BEGIN:VEVENT")[1:]:
              block = block.split("END:VEVENT")[0]
              fields = {}
              for line in block.splitlines():
                  if ":" in line:
                      key, val = line.split(":", 1)
                      fields[key.split(";")[0].upper()] = val.strip()
              start, end = fields.get("DTSTART", "")[:8], fields.get("DTEND", "")[:8]
              if not (len(start) == 8 and len(end) == 8 and start.isdigit() and end.isdigit()):
                  continue
              span = (iso(start), iso(end))
              # Dates you block yourself come through as "Not available"
              if "not available" in fields.get("SUMMARY", "").lower():
                  nights = (datetime.date.fromisoformat(span[1]) - datetime.date.fromisoformat(span[0])).days
                  if nights <= 30:  # ignore long far-future blocks
                      blocked.add(span)
              else:
                  found.add(span)

          try:
              old = json.load(open("bookings.json"))
          except Exception:
              old = None
          old = old or {}

          # Keep every past checkout forever (for monthly cleaning counts);
          # future dates always come fresh from Airbnb, so cancellations drop off.
          today = datetime.date.today().isoformat()
          def merged(new, name):
              past = {(b["in"], b["out"]) for b in old.get(name, []) if b["out"] < today}
              return [{"in": a, "out": b} for a, b in sorted(new | past)]
          bookings, blocks = merged(found, "bookings"), merged(blocked, "blocks")
          if old.get("bookings") == bookings and old.get("blocks") == blocks:
              print("No changes.")
              raise SystemExit(0)

          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open("bookings.json", "w") as fh:
              json.dump({"updated": stamp, "bookings": bookings, "blocks": blocks}, fh, indent=1)
          print(f"Saved {len(bookings)} bookings and {len(blocks)} blocks.")
          PY

      - name: Save changes to the site
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add bookings.json
          git diff --cached --quiet || (git commit -m "Update turnover calendar" && git push)
